{% extends "base.html" %}

{% block title %}Subscribe - News Flash{% endblock %}

{% block content %}
<section style="padding: 4rem 2rem;">
    <div style="max-width: 600px; margin: 0 auto; background: #f3f4f6; padding: 2rem; border-radius: 0.5rem;">
        <h1 style="margin-bottom: 1rem; color: #1f2937;">Subscribe to News Flash</h1>
        <p style="color: #6b7280; margin-bottom: 2rem;">Get the latest updates delivered to your inbox.</p>
        
        <form method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label for="name" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #1f2937;">Name</label>
                <input type="text" id="name" name="name" required style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.25rem; font-size: 1rem;">
            </div>
            
            <div>
                <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #1f2937;">Email</label>
                <input type="email" id="email" name="email" required style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.25rem; font-size: 1rem;">
            </div>
            
            <button type="submit" style="padding: 0.75rem 1.5rem; background-color: #2563eb; color: white; border: none; border-radius: 0.25rem; font-weight: 600; cursor: pointer; font-size: 1rem;">Subscribe</button>
        </form>
    </div>
</section>
{% endblock %}
